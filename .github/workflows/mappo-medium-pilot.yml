name: mappo-medium-pilot

on:
  push:
    branches: ["research/ecp-rh-experiments"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  medium-learning-pilot:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[mappo-medium]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: zr10_cooperative_lab/pyproject.toml
      - name: Install research and CPU PyTorch dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas PyYAML opencv-python-headless matplotlib gymnasium pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ./zr10_cooperative_lab --no-deps
      - name: Recheck candidate MAPPO protocol
        working-directory: zr10_cooperative_lab
        run: pytest -q tests/test_mappo_frozen_protocol.py tests/test_research_protocol.py
      - name: Train medium candidate MAPPO pilot on frozen training product
        working-directory: zr10_cooperative_lab
        run: |
          python -m zr10lab.research.candidate_mappo train \
            configs/research/scenarios/S1_single.yaml \
            configs/research/scenarios/S2_staggered.yaml \
            configs/research/scenarios/S3_crossing.yaml \
            configs/research/scenarios/S5_cluster_split.yaml \
            configs/research/scenarios/S6_contention.yaml \
            --output runs/mappo_medium/train \
            --seed 5101 \
            --env-seeds 1001 1002 1003 1004 1005 1006 1007 1008 1009 1010 1011 1012 1013 1014 1015 1016 1017 1018 1019 1020 \
            --updates 100 \
            --rollout-steps 128 \
            --checkpoint-every 25 \
            --device cpu
      - name: Validate every checkpoint on full frozen validation split
        working-directory: zr10_cooperative_lab
        run: |
          CHECKPOINTS=(runs/mappo_medium/train/candidate_mappo_seed5101_u*.pt)
          python -m zr10lab.research.candidate_mappo select \
            "${CHECKPOINTS[@]}" \
            --configs \
              configs/research/scenarios/S4_boundary_handoff.yaml \
              configs/research/scenarios/S8_maneuver.yaml \
            --seeds 2001 2002 2003 2004 2005 \
            --output runs/mappo_medium/select \
            --device cpu
          echo '=== CHECKPOINT SUMMARY ==='
          cat runs/mappo_medium/select/validation_checkpoint_summary.csv
          echo '=== SELECTED ==='
          cat runs/mappo_medium/select/selected_checkpoint.json
      - name: Summarize training history, episode coverage and split provenance
        working-directory: zr10_cooperative_lab
        run: |
          python - <<'PY'
          import csv, json, math
          from pathlib import Path

          index = json.loads(Path('runs/mappo_medium/train/candidate_mappo_seed5101_training_index.json').read_text())
          assert index['implementation'] == 'candidate_categorical_v1'
          assert index['training_env_seeds'] == list(range(1001, 1021))
          assert index['max_targets'] == 8 and index['top_search_cells'] == 65
          assert index['max_candidates'] == 512

          final_meta = json.loads(Path(index['checkpoints'][-1] + '.json').read_text())
          hist = final_meta['history']
          for lo, hi in [(0, 24), (25, 49), (50, 74), (75, 99)]:
              rows = hist[lo:hi+1]
              r = sum(x['reward_mean'] for x in rows) / len(rows)
              c = sum(x['cost_mean'] for x in rows) / len(rows)
              print(f'updates {lo+1:03d}-{hi+1:03d}: reward_mean={r:.6f}, cost_mean={c:.6f}')

          usage = final_meta.get('episode_usage', {})
          print(f"episodes_started={final_meta.get('episodes_started', 0)}, unique_scenario_seed_pairs={len(usage)}")
          if usage:
              print('episode_usage=' + json.dumps(usage, sort_keys=True))

          observed = 0.0
          for table in Path('runs/mappo_medium/select/validation_runs').rglob('research_search.csv'):
              with table.open(encoding='utf-8-sig', newline='') as handle:
                  for row in csv.DictReader(handle):
                      value = float(row['observed_count'])
                      if math.isfinite(value):
                          observed = max(observed, value)
          print(f'max_validation_observed_cells={observed:g}')

          text = json.dumps(index)
          forbidden = ['S10_heldout', 'S11_heldout', 'S9a_ood', 'S9b_ood', 'S7_overload']
          assert not any(token in text for token in forbidden)
          PY
      - name: Upload medium candidate MAPPO pilot
        uses: actions/upload-artifact@v4
        with:
          name: candidate-mappo-medium-${{ github.sha }}
          path: zr10_cooperative_lab/runs/mappo_medium
          retention-days: 30
