name: research-search-monitor

on:
  push:
    branches: ["research/ecp-rh-experiments"]
    paths-ignore:
      - "zr10_cooperative_lab/ci_results/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: zr10_cooperative_lab/pyproject.toml
      - name: Install lightweight platform and research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy PyYAML opencv-python-headless matplotlib gymnasium pytest
          python -m pip install -e ./zr10_cooperative_lab --no-deps
      - name: Compile modified modules
        run: |
          python -m compileall -q zr10_cooperative_lab/zr10lab/research
          python -m compileall -q zr10_cooperative_lab/zr10lab/models.py zr10_cooperative_lab/zr10lab/recording.py
      - name: Run research correctness tests
        working-directory: zr10_cooperative_lab
        run: pytest -q tests/test_research_search_monitor.py tests/test_research_cadence.py tests/test_research_priority_metrics.py tests/test_research_protocol.py tests/test_research_all_methods_smoke.py
      - name: Run core platform regression subset
        working-directory: zr10_cooperative_lab
        run: pytest -q tests/test_geometry.py tests/test_learning.py tests/test_control_modes.py

  pilot-experiments:
    needs: research-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: zr10_cooperative_lab/pyproject.toml
      - name: Install simulation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy PyYAML opencv-python-headless matplotlib gymnasium
          python -m pip install -e ./zr10_cooperative_lab --no-deps
      - name: Run non-held-out mechanism pilot
        working-directory: zr10_cooperative_lab
        run: |
          python -m zr10lab.research.batch \
            configs/research/scenarios/S4_boundary_handoff.yaml \
            configs/research/scenarios/S5_cluster_split.yaml \
            configs/research/scenarios/S6_contention.yaml \
            --methods fixed_scan greedy weighted_rh classical_ptz info_planner ssm_belief ecprh \
            --seeds 7101 \
            --output runs/ci_pilot \
            --fail-fast
      - name: Preserve compact pilot results in branch
        run: |
          rm -rf zr10_cooperative_lab/ci_results/pilot_latest
          mkdir -p zr10_cooperative_lab/ci_results/pilot_latest
          cp zr10_cooperative_lab/runs/ci_pilot/index.csv zr10_cooperative_lab/ci_results/pilot_latest/
          cp zr10_cooperative_lab/runs/ci_pilot/batch_status.json zr10_cooperative_lab/ci_results/pilot_latest/
          cp zr10_cooperative_lab/runs/ci_pilot/run_metrics.csv zr10_cooperative_lab/ci_results/pilot_latest/
          cp zr10_cooperative_lab/runs/ci_pilot/summary_long.csv zr10_cooperative_lab/ci_results/pilot_latest/
          cat > zr10_cooperative_lab/ci_results/pilot_latest/provenance.txt <<EOF
          source_sha=${GITHUB_SHA}
          pilot_seed=7101
          scenarios=S4_boundary_handoff,S5_cluster_split,S6_contention
          held_out_test_used=false
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zr10_cooperative_lab/ci_results/pilot_latest
          git commit -m "Store CI pilot experiment summary [skip ci]" || true
          git push
      - name: Upload full raw pilot runs
        uses: actions/upload-artifact@v4
        with:
          name: ecp-rh-pilot-raw-${{ github.sha }}
          path: zr10_cooperative_lab/runs/ci_pilot
          retention-days: 30
