# Pilot generation: effective-sensing v2 corrected
name: research-search-monitor

on:
  push:
    branches: ["research/ecp-rh-experiments"]
    paths-ignore:
      - "zr10_cooperative_lab/ci_results/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-tests:
    if: ${{ !contains(github.event.head_commit.message, '[quick-only]') && !contains(github.event.head_commit.message, '[pilot-only]') && !contains(github.event.head_commit.message, '[validation-pilot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: zr10_cooperative_lab/pyproject.toml
      - name: Install lightweight platform and research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy PyYAML opencv-python-headless matplotlib gymnasium pytest
          python -m pip install -e ./zr10_cooperative_lab --no-deps
      - name: Compile modified modules
        run: |
          python -m compileall -q zr10_cooperative_lab/zr10lab/research
          python -m compileall -q zr10_cooperative_lab/zr10lab/models.py zr10_cooperative_lab/zr10lab/recording.py
      - name: Run research correctness tests
        working-directory: zr10_cooperative_lab
        run: pytest -q tests/test_research_search_monitor.py tests/test_research_cadence.py tests/test_research_priority_metrics.py tests/test_research_protocol.py tests/test_research_all_methods_smoke.py tests/test_research_effective_sensing.py
      - name: Run core platform regression subset
        working-directory: zr10_cooperative_lab
        run: pytest -q tests/test_geometry.py tests/test_learning.py tests/test_control_modes.py

  quick-s4-diagnostic:
    if: ${{ contains(github.event.head_commit.message, '[quick-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: zr10_cooperative_lab/pyproject.toml
      - name: Install simulation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy PyYAML opencv-python-headless matplotlib gymnasium
          python -m pip install -e ./zr10_cooperative_lab --no-deps
      - name: Create non-held-out shortened S4 diagnostic config
        working-directory: zr10_cooperative_lab
        run: |
          cat > configs/research/scenarios/S4_quick_ci.yaml <<'EOF'
          extends: S4_boundary_handoff.yaml
          system: {duration_s: 45}
          policy:
            research:
              scenario:
                id: S4-quick-ci
          EOF
      - name: Run critical-method S4 diagnostic
        working-directory: zr10_cooperative_lab
        run: |
          python -m zr10lab.research.batch \
            configs/research/scenarios/S4_quick_ci.yaml \
            --methods greedy weighted_rh ssm_belief ecprh \
            --seeds 7102 \
            --output runs/ci_quick_s4 \
            --fail-fast
          echo '=== QUICK BATCH STATUS ==='
          cat runs/ci_quick_s4/batch_status.json
          echo '=== QUICK RUN METRICS ==='
          cat runs/ci_quick_s4/run_metrics.csv
      - name: Upload full quick diagnostic runs
        uses: actions/upload-artifact@v4
        with:
          name: ecp-rh-quick-s4-${{ github.sha }}
          path: zr10_cooperative_lab/runs/ci_quick_s4
          retention-days: 30

  full-mechanism-pilot:
    if: ${{ contains(github.event.head_commit.message, '[pilot-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: zr10_cooperative_lab/pyproject.toml
      - name: Install simulation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy PyYAML opencv-python-headless matplotlib gymnasium
          python -m pip install -e ./zr10_cooperative_lab --no-deps
      - name: Run full non-held-out mechanism pilot
        working-directory: zr10_cooperative_lab
        run: |
          python -m zr10lab.research.batch \
            configs/research/scenarios/S4_boundary_handoff.yaml \
            configs/research/scenarios/S5_cluster_split.yaml \
            configs/research/scenarios/S6_contention.yaml \
            --methods fixed_scan greedy weighted_rh classical_ptz info_planner ssm_belief ecprh \
            --seeds 7103 \
            --output runs/ci_full_pilot \
            --fail-fast
          echo '=== FULL PILOT BATCH STATUS ==='
          cat runs/ci_full_pilot/batch_status.json
          echo '=== FULL PILOT RUN METRICS ==='
          cat runs/ci_full_pilot/run_metrics.csv
      - name: Upload full raw pilot runs
        uses: actions/upload-artifact@v4
        with:
          name: ecp-rh-full-pilot-${{ github.sha }}
          path: zr10_cooperative_lab/runs/ci_full_pilot
          retention-days: 30

  validation-baseline-pilot:
    if: ${{ contains(github.event.head_commit.message, '[validation-pilot]') }}
    strategy:
      fail-fast: false
      matrix:
        method: [weighted_rh, classical_ptz, info_planner, ssm_belief]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: zr10_cooperative_lab/pyproject.toml
      - name: Install simulation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy PyYAML opencv-python-headless matplotlib gymnasium
          python -m pip install -e ./zr10_cooperative_lab --no-deps
      - name: Run equal-budget validation-only tuning pilot
        working-directory: zr10_cooperative_lab
        env:
          METHOD: ${{ matrix.method }}
        run: |
          python - <<'PY'
          import os, yaml
          from pathlib import Path
          from zr10lab.research.baseline_tuning import tune_baseline
          manifest = Path('configs/research/paper_experiment_manifest.yaml').resolve()
          data = yaml.safe_load(manifest.read_text(encoding='utf-8-sig'))
          method = os.environ['METHOD']
          spec = data['baseline_tuning'][method]
          root = manifest.parent
          configs = [(root / p).resolve() for p in data['splits']['validation_only']['scenarios']]
          out = Path('runs/validation_pilot') / method
          selected = tune_baseline(method, configs, [2001], spec['grid'], out,
                                   max_combinations=8,
                                   sample_seed=spec.get('parameter_sample_seed', 20261022))
          print('SELECTED=', selected)
          print(selected.read_text(encoding='utf-8'))
          PY
      - name: Upload validation pilot results
        uses: actions/upload-artifact@v4
        with:
          name: validation-pilot-${{ matrix.method }}-${{ github.sha }}
          path: zr10_cooperative_lab/runs/validation_pilot/${{ matrix.method }}
          retention-days: 30
