# Persistent-search / continuous-monitoring paper configuration.
# All targets/perception are virtual. In mirror mode physical ZR10 units only
# execute the same A/E/Zoom commands; they do not provide target detections.
extends: ../control_center.yaml

system:
  rate_hz: 10
  duration_s: 90

# The inherited legacy simulator target list is intentionally cleared. Research
# target truth lives only under policy.research.scenario.
simulation:
  targets: []

action_space:
  enabled: [yaw_deg, pitch_deg, zoom]

policy:
  mission: search_monitor
  research:
    mission: search_monitor
    method: ecprh
    execution:
      settle_s: 0.25
      settle_rate_tolerance_dps: 0.15
      zoom_stable_tolerance: 0.002
      allow_sensing_while_moving: false
      zoom_rate_per_s: 3.0
    # Public virtual sensing model. These are simulation parameters, not claims
    # about measured ZR10 detector performance. The paper must report/sweep them.
    sensing:
      reference_target_extent_m: 0.25
      discovery_min_pixels: 6.0
      monitor_min_pixels: 12.0
      # 论文实验的统一硬探测距离；几何可见但超过 100 m 不计为有效观测。
      max_effective_range_m: 100.0
    perception:
      seed: 7
      detection_probability: 0.96
      position_noise_std_m: 1.0
      velocity_noise_std_mps: 0.25
      process_noise_m2ps: 0.25
      initial_covariance_m2: 1.0
      coast_timeout_s: 3.0
      random_time_bin_s: 0.1
    # geometry-v2 直接在中央任务区内维护持久搜索栅格，避免算法继续搜索旧的
    # 170 m 远距角域。3×7×3=63 个单元，并保持与原 65 单元任务相近的计算预算。
    search:
      domain:
        type: cartesian
      roi:
        x: [10, 40]
        y: [-40, 40]
        z: [10, 60]
      grid: [3, 7, 3]
      initial_age_s: 10.0
      age_cap_s: 120.0
    planning:
      horizon_s: 3.0
      slot_s: 0.5
      replan_period_s: 0.5
      event_replan: true
      use_execution_model: true
      solver_time_limit_s: 0.12
      solver_mip_rel_gap: 0.001
      search_candidates_per_device: 10
      max_shared_targets: 3
      prediction_process_noise_m2ps: 0.5
      visibility_risk: 0.05
      use_uncertainty: true
      inter_sample_motion_factor: 0.5
      fov_margin_deg: 0.25
      handover_overlap_s: 0.5
      # 在 100 m 硬距离上限内，3x 满足发现阈值，4x 及以上用于持续监视。
      search_zoom_levels: [3.0]
      tracking_zoom_levels: [4.0, 6.0, 8.0, 10.0]
      action_ttl_s: 0.8
    baselines:
      # geometry-v2 的五种子 validation-only 选择；正式测试仍由 manifest 中的
      # SHA-256 冻结文件注入，以下同步值用于控制中心和单次运行保持一致。
      weighted_rh: {loss_weight: 3.0, overlap_weight: 3.0, search_weight: 1.0, motion_weight: 0.03}
      greedy: {}
      classical_ptz: {track_weight: 2.0, search_weight: 1.0, risk_weight: 1.0, motion_weight: 0.15}
      info_planner: {track_information_weight: 0.5, discovery_weight: 1.0, motion_weight: 0.1}
      ssm_belief: {gamma: 0.98, monitor_weight: 2.0, search_weight: 2.0, motion_weight: 0.04}
      # Learning baselines receive all 63 search cells and select from the same
      # RiskAwarePrimitiveFactory action set used by the paper methods. Padding to
      # 512 candidates is explicit and never silently truncates a larger set.
      mappo: {max_targets: 8, top_search_cells: 63, max_candidates: 512, device: cpu}
      safe_mappo: {max_targets: 8, top_search_cells: 63, max_candidates: 512, device: cpu}
    scenario:
      id: S2-staggered
      roi:
        x: [10, 40]
        y: [-40, 40]
        z: [10, 60]
      remove_outside_roi: true
      targets:
        - id: private_target_1
          start_s: 6
          end_s: 60
          trajectory: cv
          position_m: [10, -30.4, 27]
          velocity_mps: [1.0, 0.8, 0.15]
        - id: private_target_2
          start_s: 18
          end_s: 70
          trajectory: turn
          position_m: [11, 25.6, 41]
          speed_mps: 1.92
          heading_deg: -18
          turn_rate_dps: -2.5
          climb_mps: -0.05
        - id: private_target_3
          start_s: 32
          end_s: 85
          trajectory: sin
          position_m: [12, -6.4, 48]
          velocity_mps: [0.8, 0.12, -0.05]
          amplitude_m: [0, 9.6, 3]
          period_s: 24
          phase_rad: [0, 0.2, 1.0]

control_center:
  enabled: true
  video_enabled: true
  default_mode: ecprh
  duration_s: 90
  modes:
    - id: ecprh
      label: ECP-RH（本文方法）
      description: 执行约束、连续可见优先、软交接缺口的事件触发滚动时域调度。
      policy: zr10lab.research.paper_policies:PaperECPRHPolicy
      requires_detection: false
      requires_calibration: false
      settings: {mission: search_monitor}
    - id: weighted_rh
      label: Weighted RH-MPC
      description: 与本文方法共享预测、候选原语、软交接变量与决策机会的有限权重基线。
      policy: zr10lab.research.paper_policies:PaperWeightedRHPolicy
      requires_detection: false
      requires_calibration: false
      settings: {mission: search_monitor}
    - id: greedy
      label: Execution-aware Myopic Greedy
      description: 使用相同可执行候选，在各候选最早可感知时隙做单步词典序贪心，不进行多步联合规划。
      policy: zr10lab.research.paper_policies:PaperGreedyPolicy
      requires_detection: false
      requires_calibration: false
      settings: {mission: search_monitor}
    - id: fixed_scan
      label: Fixed Scan + Reactive Track
      description: 固定分区周期扫描与反应式目标接管工程基线。
      policy: zr10lab.research.paper_policies:FixedScanReactivePolicy
      requires_detection: false
      requires_calibration: false
      settings: {mission: search_monitor}
    - id: classical_ptz
      label: Classical Constrained PTZ
      description: 经典受约束 PTZ 跟踪/机会观测思想的统一执行模型适配。
      policy: zr10lab.research.paper_policies:PaperClassicalPTZPolicy
      requires_detection: false
      requires_calibration: false
      settings: {mission: search_monitor}
    - id: info_planner
      label: Information Planner
      description: 发现/跟踪信息价值贪心规划基线。
      policy: zr10lab.research.paper_policies:PaperInformationPlannerPolicy
      requires_detection: false
      requires_calibration: false
      settings: {mission: search_monitor}
    - id: ssm_belief
      label: SSM Belief Look-ahead
      description: 固定 PTZ 执行模型上的 simultaneous-search-monitoring belief look-ahead 适配。
      policy: zr10lab.research.paper_policies:PaperSSMBeliefPolicy
      requires_detection: false
      requires_calibration: false
      settings: {mission: search_monitor}
