# CI/快速验收场景。它是场景配置，不是算法配置；benchmark runner 会动态注入算法入口。
extends: coverage_common.yaml
system:
  duration_s: 20
policy:
  scenario_id: coverage_smoke_v1
  roi:
    x: [12.0, 18.0]
    y: [-5.0, 5.0]
    z: [8.0, 12.0]
  coverage:
    evaluation_grid: [3, 3, 2]
    candidate_grid: [2, 2, 1]
    dwell_s: 0.10
    settle_s: 0.10
    completion_threshold: 1.0
