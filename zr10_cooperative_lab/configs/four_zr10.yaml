# 示例外参与内参仅用于仿真。实机运行前请逐台替换并标记 calibration_verified。
# ENU: x东/y北/z上（m）；安装姿态顺序 [roll,pitch,yaw]（deg），俯仰向上为正。
# 注意：本文件是演示/仿真模板，不应直接 --arm；正式覆盖实机请使用 coverage_hardware_*.yaml。
system:
  rate_hz: 10
  duration_s: 60
  telemetry_stale_s: 0.5
  max_frame_age_s: 0.6
  pose_max_gap_s: 0.2
  action_ttl_s: 0.5
  require_all_devices: true
  startup_timeout_s: 8

policy:
  name: cooperative
  mode: multi

  # 需要观测的三维空间，单位米，与设备 position_m 使用同一坐标系。
  # 以下是演示区域，实机时替换为你的场地范围。
  roi:
    x: [ 100, 160 ]
    y: [ -50, 50 ]
    z: [ 35, 85 ]

  # 使用区域网格生成扫描点。
  # 默认文件中原本有一行具体的 scan_points_m 列表，
  # 必须将那一行替换为 null，不要重复添加同名字段。
  scan_points_m: null

  # x、y、z 方向分别取 3、5、2 个位置，共 30 个扫描点。
  scan_grid: [ 3, 5, 2 ]

  # 同组设备到达目标方向后驻留 2 秒，再切换扫描点。
  scan_dwell_s: 2.0
  scan_settle_tolerance_deg: 1.0
  fov_margin: 0.08
  minimum_dwell_s: 0.8
  assignment_switch_penalty: 0.35
  prediction_horizon_s: 0.2
  ray_search_distance_m: 140
  search_hypothesis_ttl_s: 1.5
action_space:
  # 消融实验只改变此列表；zoom 开放后仍需覆盖倍率范围的实测内参。
  enabled: [yaw_deg, pitch_deg]
fusion:
  max_time_skew_s: 0.08
  min_ray_angle_deg: 2.0
  max_condition_number: 100000
  max_residual_m: 2.0
  max_range_m: 2000
  measurement_floor_m: 0.05
  process_accel_std_mps2: 3.0
  track_gate_mahalanobis: 16.27
  track_gate_distance_m: 15
  track_timeout_s: 2.0
  confirmation_hits: 3
  max_hypotheses: 300
  max_rays: 80
  ambiguity_margin: 0.15
logging: {root: runs, queue_size: 30000}
detector:
  type: yolo
  weights: ../models/drone.pt
  confidence: 0.35
  imgsz: 640
  classes: [0]
  device: cpu
simulation:
  seed: 7
  detection_probability: 0.96
  pixel_noise_std: 0.7
  zoom_rate_per_s: 3
  targets:
    - id: uav_1
      position_m: [110, -15, 62]
      amplitude_m: [8, 20, 5]
      period_s: 36
      phase_rad: [0, 1.5707963, 0.4]
    - id: uav_2
      position_m: [135, 22, 76]
      amplitude_m: [5, -20, 7]
      period_s: 45
      phase_rad: [0.6, 2.1707963, 0.2]
  outages: []
devices:
  - &station
    id: zr10_25
    ip: 192.168.144.25
    port: 37260
    position_m: [0, -30, 2]
    mount_rpy_deg: [0, 25, 0]
    calibration_verified: false  # 演示参数，禁止直接用于 --arm 实机闭环
    rtsp_url: rtsp://192.168.144.25:8554/main.264
    yaw_limits_deg: [-130, 130]
    pitch_limits_deg: [-85, 25]
    zoom_limits: [1, 10]
    initial_yaw_deg: 0
    initial_pitch_deg: 0
    initial_zoom: 1
    max_slew_dps: 30
    capabilities: {zoom: true, focus_direction: false, autofocus: false, gimbal_mode: false}
    control:
      mode: velocity_p
      yaw_sign: 1
      pitch_sign: 1
      yaw_offset_deg: 0
      pitch_offset_deg: 0
      yaw_velocity_sign: 1
      pitch_velocity_sign: -1
      normalize_pitch_feedback: true
      yaw_kp: 2
      pitch_kp: 2
      deadband_deg: 0.5
      yaw_speed_limit: 25
      pitch_speed_limit: 25
      command_timeout_s: 0.25
      use_ack: true
    camera:
      image_size: [1920, 1080]
      angular_std_deg: 0.15
      video_latency_s: 0.0
      time_uncertainty_s: 0.15
      # 以下估算值只服务仿真；不同镜头批次、分辨率、电子裁切需分别标定。
      intrinsics:
        - {zoom: 1, fx: 1613.72, fy: 1613.72, cx: 960, cy: 540, dist: [0,0,0,0,0]}
        - {zoom: 10, fx: 15696.52, fy: 15696.52, cx: 960, cy: 540, dist: [0,0,0,0,0]}
  - <<: *station
    id: zr10_26
    ip: 192.168.144.26
    position_m: [0, 30, 2]
    rtsp_url: rtsp://192.168.144.26:8554/main.264
  - <<: *station
    id: zr10_27
    ip: 192.168.144.27
    position_m: [30, -30, 2]
    rtsp_url: rtsp://192.168.144.27:8554/main.264
  - <<: *station
    id: zr10_28
    ip: 192.168.144.28
    position_m: [30, 30, 2]
    rtsp_url: rtsp://192.168.144.28:8554/main.264
