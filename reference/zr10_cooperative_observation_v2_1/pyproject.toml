[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zr10-cooperative-observation"
version = "0.4.1"
description = "Scalable cooperative observation and logging framework for multiple SIYI ZR10 gimbals"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7.0",
  "numpy>=1.24,<3.0",
  "opencv-python>=4.8,<5.0",
]

[tool.setuptools.packages.find]
include = ["zr10_coop*"]

